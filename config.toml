[settings]
auto_install = true
legacy_version_file = true
not_found_system_fallback = true

[bootstrap.repos]
"~/Projects/nvim" = { url = "https://github.com/remoterabbit/nvim", ref = "main" }
"~/Projects/dots" = { url = "https://github.com/remoterabbit/dots", ref = "main" }
"~/repos/personal/zsh" = { url = "https://github.com/remoterabbit/zsh" }

[dotfiles]
"~/.config/nvim" = { source = "~/Projects/nvim", mode = "symlink" }
"~/.config/zsh" = { source = "~/repos/personal/zsh", mode = "symlink" }
"~/.zshenv" = { source = "~/repos/personal/zsh/.zshenv", mode = "symlink" }
"~/.config/mise/config.toml" = "~/Projects/dots/config.toml"

[bootstrap.macos.dock]
autohide = true
orientation = "bottom"
tilesize = 48
show_recents = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }

[bootstrap.packages]
# Arch
"pacman:zsh" = "latest"
"pacman:neovim" = "latest"
"pacman:eza" = "latest"
"pacman:bat" = "latest"
"pacman:git-delta" = "latest"
"pacman:ripgrep" = "latest"
"pacman:fd" = "latest"
"pacman:fzf" = "latest"
"pacman:starship" = "latest"
"pacman:zoxide" = "latest"
"pacman:atuin" = "latest"
"pacman:direnv" = "latest"
"pacman:shellcheck" = "latest"

# macOS
"brew:zsh" = { os = "macos" }
"brew:neovim" = { os = "macos" }
"brew:eza" = { os = "macos" }
"brew:bat" = { os = "macos" }
"brew:git-delta" = { os = "macos" }
"brew:ripgrep" = { os = "macos" }
"brew:fd" = { os = "macos" }
"brew:fzf" = { os = "macos" }
"brew:starship" = { os = "macos" }
"brew:zoxide" = { os = "macos" }
"brew:atuin" = { os = "macos" }
"brew:direnv" = { os = "macos" }
"brew:shellcheck" = { os = "macos" }
"brew:detect-secrets" = { os = "macos" }
